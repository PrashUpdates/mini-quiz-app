<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Quiz App</title>
  <link rel="stylesheet" href="app.css">
</head>

<body>
  <div class="container">
    <div class="box1">
      <div class="top">
        <p class="steps"><span id="count">1</span>/5</p>
      </div>
      <h3 id="question" class="Qn">
        Question 1: What is the largest planet in our solar system?
      </h3>
      <div id="btns">
        <button id="option1" class="btn1">A) Earth</button>
        <button id="option2" class="btn2">B) Mars</button>
        <button id="option3" class="btn3">C) Jupiter</button>
        <button id="option4" class="btn4">D) Venus</button>
      </div>
    
      <div class="next-align">
      <button class="previous"><</button>
      <button class="next">Next</button>
      </div>
      
    </div>

  </div>

  <script src="main.js"></script>
</body>

</html>
